name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dd_disable
            com.local.dd_disable.plist
